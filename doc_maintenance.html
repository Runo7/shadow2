<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wartungsprotokoll</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <header class="mobile-header">
        <a href="documents.html" style="color: var(--text-color); font-size: 1.2rem;"><i
                class="fas fa-arrow-left"></i></a>
        <h1>Wartungsprotokoll</h1>
        <div style="width: 25px;"></div>
    </header>

    <div class="container">
        <div class="card">
            <div class="form-header">
                <h3>Anlagenprüfung</h3>
            </div>

            <div class="form-row">
                <label class="form-label">Anlagentyp</label>
                <div style="display: flex; gap: 10px;">
                    <label style="display: flex; align-items: center; gap: 5px;"><input type="radio" name="type"
                            checked> Gas</label>
                    <label style="display: flex; align-items: center; gap: 5px;"><input type="radio" name="type">
                        Öl</label>
                    <label style="display: flex; align-items: center; gap: 5px;"><input type="radio" name="type">
                        WP</label>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label">Checkliste</label>
                <div style="border: 1px solid #eee; border-radius: 8px; padding: 10px;">
                    <label style="display: flex; align-items: center; gap: 10px; padding: 5px 0;">
                        <input type="checkbox" checked> Druckprüfung durchgeführt
                    </label>
                    <label style="display: flex; align-items: center; gap: 10px; padding: 5px 0;">
                        <input type="checkbox"> Filter gereinigt
                    </label>
                    <label style="display: flex; align-items: center; gap: 10px; padding: 5px 0;">
                        <input type="checkbox"> Sicherheitsventil getestet
                    </label>
                    <label style="display: flex; align-items: center; gap: 10px; padding: 5px 0;">
                        <input type="checkbox"> Messwerte protokolliert
                    </label>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label">Gemessene Werte (Abgas/Druck)</label>
                <textarea class="form-input" rows="3"></textarea>
            </div>
        </div>

        <div class="signature-section">
            <label class="form-label">Unterschrift Techniker</label>
            <div class="signature-pad-container" id="pad-technician">
                <canvas class="signature-canvas"></canvas>
            </div>
            <button class="clear-sig-btn" onclick="clearSignature('pad-technician')">Unterschrift löschen</button>
            <button class="btn-sign" onclick="saveDocument()">Protokoll speichern</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-client.js"></script>
    <script src="script.js"></script>
    <script>
        // Override clearSignature to use the class method if available or global helper
        // The global helper in script.js is window.clearSignature(id).
        // The mock function here was: function clearSignature() { alert('Unterschrift gelöscht (Mock)'); }
        // We can just remove the mock function and let the button call the global one from script.js.
        // However, the button uses onclick="clearSignature('pad-technician')".
        // script.js defines window.clearSignature = function(padId) {...}
        // So we just need to NOT define a conflicting local function.

        async function saveDocument() {
            const btn = document.querySelector('.btn-sign');
            if (btn) btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Speichern...';

            // 1. Gather Data
            const typeInputs = document.querySelectorAll('input[name="type"]');
            let type = 'Gas';
            typeInputs.forEach(inp => { if (inp.checked) type = inp.parentNode.textContent.trim(); });

            const checklistMap = [
                'Druckprüfung durchgeführt',
                'Filter gereinigt',
                'Sicherheitsventil getestet',
                'Messwerte protokolliert'
            ];
            const checks = [];
            const checkboxes = document.querySelectorAll('.form-row .form-label + div input[type="checkbox"]');
            checkboxes.forEach((cb, idx) => {
                const label = cb.parentNode.textContent.trim();
                if (cb.checked) checks.push(label || checklistMap[idx] || 'Unbekannt');
            });

            const values = document.querySelector('textarea.form-input').value || '';

            // Signature
            const canvasTech = document.querySelector('#pad-technician canvas');
            const sigTechData = canvasTech ? canvasTech.toDataURL() : '';

            const date = new Date().toISOString().split('T')[0];
            const title = `Wartung: ${type}`;

            // 2. Prepare Data Object
            const docData = {
                title: title,
                order_name: 'Wartung', // Could be dynamic if we had an order field
                date: date,
                type: 'Wartungsprotokoll',
                content: {
                    maintenance_type: type,
                    checklist: checks,
                    measured_values: values,
                    signatures: {
                        technician: sigTechData
                    }
                },
                created_at: new Date().toISOString()
            };

            // 3. Save to Supabase
            if (window.supa) {
                try {
                    const { data, error } = await window.supa
                        .from('documents')
                        .insert([docData]);

                    if (error) throw error;
                    console.log('Document saved to Supabase');
                } catch (err) {
                    console.error('Supabase save failed:', err);
                    alert('Fehler beim Speichern in der Cloud. (Offline-Mode nicht implementiert für diesen Typ)');
                    // Optional: Implement local save fallback like in script.js
                }
            } else {
                alert('Keine Verbindung zur Datenbank (Supabase nicht initialisiert).');
            }

            alert('Wartungsprotokoll erfolgreich gespeichert!');
            window.location.href = 'documents.html';
        }
    </script>
</body>

</html>
