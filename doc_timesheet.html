<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stundenzettel</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <header class="mobile-header">
        <a href="documents.html" style="color: var(--text-color); font-size: 1.2rem;"><i
                class="fas fa-arrow-left"></i></a>
        <h1>Stundenzettel</h1>
        <div style="width: 25px;"></div>
    </header>

    <div class="container">
        <div class="card">
            <div class="form-header">
                <h3>Wochenübersicht KW 01</h3>
            </div>

            <div class="form-row">
                <table style="width: 100%; border-collapse: collapse; font-size: 0.9rem;">
                    <tr style="border-bottom: 1px solid #eee;">
                        <th style="text-align: left; padding: 10px 0;">Tag</th>
                        <th style="padding: 10px 0;">Arbeit</th>
                        <th style="padding: 10px 0;">Fahrt</th>
                    </tr>
                    <tr>
                        <td style="padding: 10px 0;">Mo</td>
                        <td><input type="text" class="form-input" style="padding: 5px;" value="8.0"></td>
                        <td><input type="text" class="form-input" style="padding: 5px;" value="1.0"></td>
                    </tr>
                    <tr>
                        <td style="padding: 10px 0;">Di</td>
                        <td><input type="text" class="form-input" style="padding: 5px;"></td>
                        <td><input type="text" class="form-input" style="padding: 5px;"></td>
                    </tr>
                    <tr>
                        <td style="padding: 10px 0;">Mi</td>
                        <td><input type="text" class="form-input" style="padding: 5px;"></td>
                        <td><input type="text" class="form-input" style="padding: 5px;"></td>
                    </tr>
                    <tr>
                        <td style="padding: 10px 0;">Do</td>
                        <td><input type="text" class="form-input" style="padding: 5px;"></td>
                        <td><input type="text" class="form-input" style="padding: 5px;"></td>
                    </tr>
                    <tr>
                        <td style="padding: 10px 0;">Fr</td>
                        <td><input type="text" class="form-input" style="padding: 5px;"></td>
                        <td><input type="text" class="form-input" style="padding: 5px;"></td>
                    </tr>
                </table>
            </div>

            <div class="form-row">
                <label class="form-label">Gesamtstunden</label>
                <div style="font-size: 1.2rem; font-weight: 700;">9.0 h</div>
            </div>
        </div>

        <div class="signature-section">
            <label class="form-label">Unterschrift Mitarbeiter</label>
            <div class="signature-pad" id="sig-pad">
                <canvas class="signature-canvas"></canvas>
            </div>
            <button class="btn-clear" onclick="clearSignature('sig-pad')">Löschen</button>
            <button class="btn-sign" onclick="saveDocument()">Einreichen</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-client.js"></script>
    <script src="script.js"></script>
    <script>
        // Override global clear if needed, or rely on script.js
        // The button calls clearSignature('sig-pad'). Script.js has window.clearSignature(id).
        // This matches.

        async function saveDocument() {
            const btn = document.querySelector('.btn-sign');
            if (btn) btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Speichern...';

            const rows = document.querySelectorAll('table tr:not(:first-child)');
            const entries = [];
            let totalHours = 0;

            rows.forEach(row => {
                const cells = row.querySelectorAll('td');
                const day = cells[0].textContent.trim();
                const work = cells[1].querySelector('input').value || 0;
                const ride = cells[2].querySelector('input').value || 0;

                if (parseFloat(work) > 0 || parseFloat(ride) > 0) {
                    entries.push({ day, work, ride });
                    totalHours += parseFloat(work) + parseFloat(ride);
                }
            });

            // Signature
            const canvas = document.querySelector('#sig-pad canvas');
            const sigData = canvas ? canvas.toDataURL() : '';

            const date = new Date().toISOString().split('T')[0];
            const kw = "KW " + getWeekNumber(new Date()); // script.js has getWeekNumber but maybe not globally exposed?
            // getWeekNumber is at end of script.js, checking if exposed. 
            // It is defined as `function getWeekNumber(d) {...}` at bottom. 
            // It is NOT attached to window. So it might not be accessible here unless script.js is loaded and function is in global scope.
            // In browser, top level functions are global. So it should work.

            const title = `Stundenzettel: ${kw}`;

            const docData = {
                title: title,
                order_name: 'Stunden',
                date: date,
                type: 'Stundenzettel',
                content: {
                    week: kw,
                    entries: entries,
                    total_hours: totalHours,
                    signatures: {
                        employee: sigData
                    }
                },
                created_at: new Date().toISOString()
            };

            if (window.supa) {
                try {
                    const { data, error } = await window.supa
                        .from('documents')
                        .insert([docData]);
                    if (error) throw error;
                    console.log('Document saved to Supabase');
                } catch (err) {
                    console.error('Supabase save failed:', err);
                    alert('Fehler: Konnte nicht in Cloud speichern.');
                }
            } else {
                alert('Keine Verbindung zur Datenbank.');
            }

            alert('Stundenzettel erfolgreich eingereicht!');
            window.location.href = 'documents.html';
        }
    </script>
</body>

</html>
