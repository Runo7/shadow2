<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abnahmeprotokoll WP</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <header class="mobile-header">
        <a href="documents.html" style="color: var(--text-color); font-size: 1.2rem;"><i
                class="fas fa-arrow-left"></i></a>
        <h1>Abnahmeprotokoll</h1>
        <div style="width: 25px;"></div>
    </header>

    <div class="container">
        <div class="card">
            <div class="form-header">
                <h3>Übergabe Wärmepumpe</h3>
            </div>

            <div class="form-row">
                <label class="form-label">Fabrikat / Modell</label>
                <input type="text" class="form-input" placeholder="Hersteller X, Modell Y">
            </div>

            <div class="form-row">
                <label class="form-label">Seriennummer</label>
                <input type="text" class="form-input">
            </div>

            <div class="form-row">
                <label class="form-label">Prüfpunkte</label>
                <div style="border: 1px solid #eee; border-radius: 8px; padding: 10px;">
                    <label style="display: flex; align-items: center; gap: 10px; padding: 5px 0;">
                        <input type="checkbox" checked> Elektrischer Anschluss geprüft
                    </label>
                    <label style="display: flex; align-items: center; gap: 10px; padding: 5px 0;">
                        <input type="checkbox" checked> Hydraulik entlüftet
                    </label>
                    <label style="display: flex; align-items: center; gap: 10px; padding: 5px 0;">
                        <input type="checkbox"> Einweisung Betreiber erfolgt
                    </label>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label">Bemerkungen</label>
                <textarea class="form-input" rows="2"></textarea>
            </div>
        </div>

        <div class="signature-section">
            <label class="form-label">Unterschrift Anlagenbetreiber</label>
            <div class="signature-pad-container" id="pad-operator">
                <canvas class="signature-canvas"></canvas>
            </div>
            <button class="clear-sig-btn" onclick="clearSignature('pad-operator')">Unterschrift löschen</button>
            <button class="btn-sign" onclick="saveDocument()">Abnahme bestätigen</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-client.js"></script>
    <script src="script.js"></script>
    <script>
        async function saveDocument() {
            const btn = document.querySelector('.btn-sign');
            if (btn) btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Speichern...';

            const model = document.querySelector('input[placeholder="Hersteller X, Modell Y"]').value || '-';
            const serial = document.querySelectorAll('.form-input')[1].value || '-'; // Assuming 2nd input is SN

            const checks = [];
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                if (cb.checked) checks.push(cb.parentNode.textContent.trim());
            });

            const remarks = document.querySelector('textarea').value || '';
            const canvas = document.querySelector('#pad-operator canvas');
            const sigData = canvas ? canvas.toDataURL() : '';

            const date = new Date().toISOString().split('T')[0];
            const title = `Abnahme WP: ${model}`;

            const docData = {
                title: title,
                order_name: 'Abnahme WP',
                date: date,
                type: 'Abnahmeprotokoll_WP',
                content: {
                    model: model,
                    serial_number: serial,
                    checklist: checks,
                    remarks: remarks,
                    signatures: {
                        operator: sigData
                    }
                },
                created_at: new Date().toISOString()
            };

            if (window.supa) {
                try {
                    const { data, error } = await window.supa
                        .from('documents')
                        .insert([docData]);
                    if (error) throw error;
                    console.log('Document saved to Supabase');
                } catch (err) {
                    console.error('Supabase save failed:', err);
                    alert('Fehler: Konnte nicht in Cloud speichern.');
                }
            } else {
                alert('Keine Verbindung zur Datenbank.');
            }

            alert('Abnahmeprotokoll erfolgreich gespeichert!');
            window.location.href = 'documents.html';
        }
    </script>

</body>

</html>
